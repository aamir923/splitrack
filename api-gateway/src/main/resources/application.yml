spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
      username: gave_redis_service
      password: ${GAVE_REDIS_PASSWORD}

server:
  port: 8080

gave:
  csrf:
    cookie-secure: false
  jwt:
    private-key: file:${user.home}/.gave/keys/jwt-private.pem
    public-key: file:${user.home}/.gave/keys/jwt-public.pem
    key-id: gateway-1
    issuer: gave-gateway
    audience: gave-services
    ttl: 60s
  services:
    user-service:
      url: http://localhost:8081

