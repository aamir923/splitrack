name: gave

services:
  user-db:
    image: postgres:17
    container_name: gave-user-db
    environment:
      POSTGRES_DB: gave_user
      POSTGRES_USER: gave_service
      POSTGRES_PASSWORD: ${GAVE_SERVICE_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - gave-user-db-data:/var/lib/postgresql/data

  group-db:
    image: postgres:17
    container_name: gave-group-db
    environment:
      POSTGRES_DB: gave_group
      POSTGRES_USER: gave_group_service
      POSTGRES_PASSWORD: ${GAVE_GROUP_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - gave-group-db-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: gave-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --user
      - default
      - "off"
      - --user
      - gave_redis_service
      - "on"
      - ">${GAVE_REDIS_PASSWORD}"
      - "~*"
      - "&*"
      - "+@all"
      - "-@dangerous"
    ports:
      - "6379:6379"
    volumes:
      - gave-redis-data:/data

volumes:
  gave-user-db-data:
  gave-group-db-data:
  gave-redis-data:

