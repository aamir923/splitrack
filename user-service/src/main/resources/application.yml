spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5433/gave_user
    username: gave_service
    password: ${GAVE_SERVICE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

server:
  port: 8081