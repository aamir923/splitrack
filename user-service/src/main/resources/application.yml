spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5433/gave_user
    username: gave_service
    password: ${GAVE_SERVICE_PASSWORD}
  data:
    redis:
      host: localhost
      port: 6379
      username: gave_redis_service
      password: ${GAVE_REDIS_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

gave:
  session:
    ttl: 30d
    cookie-secure: false

server:
  port: 8081